schema:
  name: ebics_ride_config
  version: 0
  status: draft
  target_version: 1
  complete_for_codegen: false
  reason_incomplete: >-
    Numeric wire IDs and deliberately uncalibrated profile defaults must be
    approved before generating firmware or Canable sources.

wire_protocol:
  transport: versioned_multiframe_block
  legacy_compatibility: Para0_Para1_Para2_read_write
  id_state: unassigned
  numeric_values: user_facing_engineering_units
  torque_user_unit: kilogram_force
  torque_native_values: hidden_service_and_firmware_only
  wire_encoding: round_engineering_value_divided_by_scale
  id_policy: >-
    Do not reuse apparently free Para0/Para1/Para2 bytes. Audit the existing
    HMI command space first, then allocate a separate versioned range.

command_plan:
  base_wire_command: null
  allocation_status: waiting_for_canable_and_full_hmi_log_audit
  commands:
    capabilities_schema: {offset: 0, wire_id: null}
    read_saved: {offset: 1, wire_id: null}
    read_runtime: {offset: 2, wire_id: null}
    apply_ram: {offset: 3, wire_id: null}
    save_flash: {offset: 4, wire_id: null}
    revert_ram: {offset: 5, wire_id: null}
  excluded_commands:
    - "0x0203"
    - "0x0204"
    - "0x1200"
    - "0x3000"
    - "0x3005"
    - "0x3100"
    - "0x3200-0x3205"
    - "0x320F"
    - "0x6000-0x6012"
    - "0x6017"
    - "0x6025-0x6026"
    - "0x6029"
    - "0x602B"
    - "0x602C"
    - "0x6101"
    - "0x6200"
    - "0x62D9"
    - "0x6300-0x6304"
    - "0x6400-0x6401"
    - "0xF203"

levels:
  - {index: 1, key: eco, label: ECO}
  - {index: 2, key: tour, label: TOUR}
  - {index: 3, key: sport, label: SPORT}
  - {index: 4, key: sport_plus, label: SPORT+}
  - {index: 5, key: boost, label: BOOST}

access_profiles:
  persistent_rw:
    persistent: true
    operations: [read, apply_ram, save_flash, revert]
  legacy_rw:
    persistent: true
    operations: [read, apply_ram, save_flash, revert]
    compatibility_only: true
  read_only:
    persistent: false
    operations: [read]
  calibration_operation:
    persistent: false
    operations: [calibrate]
  internal_persistent:
    persistent: true
    operations: [read, apply_ram, save_flash, revert]
    user_visible: false

enums:
  mode_type:
    # FW-094: value 0 selected the pre-ride-core assist path per level. That path is removed;
    # 0 is now reserved and produces no assist. It must NOT be reused for a new mode - stored
    # banks and older app builds still write it.
    reserved_0: 0
    power_linear: 1
    power_progressive: 2
    emtb: 3
    # Accepted by the bank validator and migrated to SPORT like the rest of 1..6. It is
    # NOT SELECTABLE - no app may offer it as a new choice - but refusing a stored 4 would
    # throw away the other four levels of the same bank with it.
    emtb_custom: 4
    torque: 5
    power_curve: 6
    # ASSIST PIPELINE V2. The six profiles, and the only values an app should write today.
    # 1..6 above are still accepted and still migrated, so a bank saved before V2 keeps
    # working; a stored number is never rewritten on read. >= 13 is unknown and refuses the
    # WHOLE bank. See docs/ASSIST_PIPELINE_V2.md, the stored-configuration contract.
    v2_eco: 7
    v2_trail: 8
    v2_sport: 9
    v2_sport_plus: 10
    v2_auto: 11
    v2_auto_sport_plus: 12
  startup_boost_mode:
    cadence: 0
    speed: 1
    auto: 2
  taper_shape:
    linear: 0
    smoothstep: 1
    map: 2

rules:
  - id: speed_taper_order
    expression: taper_start_kph <= taper_end_kph
  - id: support_bounds_order
    expression: support_min_pct <= support_max_pct
  - id: ramp_speed_order
    expression: ramp_speed_low_kph <= ramp_speed_high_kph
  - id: ramp_cadence_order
    expression: ramp_cadence_low_rpm <= ramp_cadence_high_rpm
  - id: not_selectable_ride_core_modes
    # NOT SELECTABLE, which is a different statement from NOT ACCEPTED. A bank carrying
    # either value loads normally - 0 leaves that level producing no assist, 4 migrates to
    # SPORT with the rest of the legacy numbers. What no app may do is OFFER them as a new
    # choice for a rider to pick.
    expression: mode_type not in [reserved_0, emtb_custom]
  - id: level_off_is_a_zero_torque_ceiling
    # One meaning for one byte, at both ends of the wire: 0 switches the level off. A
    # ceiling of the level's own that changes nothing is 100, not 0. A request with no
    # assist level behind it says so with AP2_LIMITS_NO_LEVEL_CEILING instead.
    expression: max_iq_pct == 0 implies the level produces no assist
  - id: zero_dynamics_means_use_the_profile
    # A per-level override of 0 leaves the PROFILE's value in force. Neither end may clamp
    # a stored 0 up to the 20 ms ramp floor - every shipped level stores 0, so one clamp
    # turns a read -> save with no edit at all into a real change of behaviour.
    expression: iq_rise_fast_ms, release_ms or smooth_start_duration_ms of 0 means the profile value
  - id: no_rotation_safe_default
    expression: assist_without_rotation == false
  - id: torque_public_scale
    expression: torque_full_scale_kg == 60.00
  - id: torque_zero_automatic_only
    expression: torque_zero_native is not writable
  - id: torque_calibration_order
    expression: torque_full_scale_native > torque_zero_native

# wire_id: null is intentional in draft version 0. It is not a free byte.
profile_fields:
  - key: mode_type
    wire_id: null
    since: 1
    access: persistent_rw
    per_level: true
    value: {type: enum8, enum: mode_type, scale: 1, unit: none, min: 0, max: 12, default: v2_trail}
    implementation: active_v2_profiles_7_12_with_migration_of_0_6
    ui_group: characteristic

  - key: support_ratio_pct
    wire_id: null
    since: 1
    access: persistent_rw
    per_level: true
    value: {type: u16, scale: 1, unit: percent, min: 0, max: 1000, default: null}
    implementation: active_compile_time_defaults_protocol_planned
    ui_group: characteristic

  - key: support_min_pct
    wire_id: null
    since: 1
    access: persistent_rw
    per_level: true
    value: {type: u16, scale: 1, unit: percent, min: 0, max: 1000, default: null}
    implementation: active_compile_time_default_protocol_planned
    ui_group: characteristic

  - key: support_max_pct
    wire_id: null
    since: 1
    access: persistent_rw
    per_level: true
    value: {type: u16, scale: 1, unit: percent, min: 0, max: 1000, default: null}
    implementation: active_compile_time_default_protocol_planned
    ui_group: characteristic

  - key: reference_power_w
    wire_id: null
    since: 1
    access: persistent_rw
    per_level: true
    value: {type: u16, scale: 1, unit: watt, min: 50, max: 500, default: 200}
    implementation: active_compile_time_default_protocol_planned
    ui_group: characteristic

  - key: progression_pct
    wire_id: null
    since: 1
    access: persistent_rw
    per_level: true
    value: {type: u8, scale: 1, unit: percent, min: 0, max: 100, default: 0}
    implementation: active_compile_time_default_protocol_planned
    ui_group: characteristic

  - key: max_motor_power_w
    wire_id: null
    since: 1
    access: persistent_rw
    per_level: true
    value: {type: u16, scale: 1, unit: watt, min: 0, max: 1500, default: null}
    implementation: active_hard_limit_and_profile_field_protocol_planned
    ui_group: limits

  - key: max_iq_pct
    wire_id: null
    since: 1
    access: persistent_rw
    per_level: true
    value: {type: u8, scale: 1, unit: percent_phase_limit, min: 0, max: 100, default: 100}
    zero_means: level_switched_off
    implementation: active_level_ceiling_and_off_switch
    legacy_binding: Para1_level_current_slots
    ui_group: limits

  # FW-129 D12: active in firmware since FW-056 and simply missing here. Two gammas x10, one
  # per half of the support window, used only by mode_type == power_curve.
  - key: curve_exponent_x10
    wire_id: null
    since: 4
    access: persistent_rw
    per_level: true
    value: {type: u8, scale: 0.1, unit: none, min: 0.3, max: 2.5, default: 1.5}
    implementation: active_power_curve_lower_half_gamma
    applies_to_modes: [power_curve]
    ui_group: characteristics

  - key: curve_exponent_high_x10
    wire_id: null
    since: 4
    access: persistent_rw
    per_level: true
    value: {type: u8, scale: 0.1, unit: none, min: 0.3, max: 2.5, default: 1.5}
    implementation: active_power_curve_upper_half_gamma
    applies_to_modes: [power_curve]
    ui_group: characteristics

  # FW-129 D12: active in firmware, missing here. 120 = 1.0x; mode_type == torque only.
  - key: torque_assist_factor
    wire_id: null
    since: 1
    access: persistent_rw
    per_level: true
    value: {type: u8, scale: 1, unit: none, min: 0, max: 254, default: null}
    implementation: active_firmware_defaults_50_80_120_160_200
    applies_to_modes: [torque]
    ui_group: characteristics

  - key: emtb_parameter
    wire_id: null
    since: 1
    access: persistent_rw
    per_level: true
    value: {type: u8, scale: 1, unit: none, min: 0, max: 250, default: null}
    implementation: active_firmware_defaults_60_100_140_160_180
    reference: emmebrusa_apply_emtb_assist_denominator_510_minus_2x
    applies_to_modes: [emtb]
    ui_group: characteristics

  - key: emtb_based_on_power
    wire_id: null
    since: 1
    access: persistent_rw
    per_level: true
    value: {type: bool, scale: 1, unit: none, min: false, max: true, default: true}
    implementation: active_cadence_reduces_denominator_when_true
    ui_group: characteristics

  - key: emtb_reference_voltage_mv
    wire_id: null
    since: 1
    access: persistent_rw
    per_level: true
    value: {type: u16, scale: 1, unit: millivolt, min: 24000, max: 60000, default: 36000}
    implementation: active_power_normalization_reference
    ui_group: characteristics

  - key: assist_without_rotation
    wire_id: null
    since: 1
    access: persistent_rw
    per_level: true
    value: {type: bool, scale: 1, unit: none, min: false, max: true, default: false}
    implementation: active_compile_time_default_protocol_planned
    safety_relevant: true
    ui_group: start_boost

  - key: minimum_pedal_load_kg
    wire_id: null
    since: 1
    access: persistent_rw
    per_level: true
    # RESTORED to baseline (was 2.5 in regression). FW-150 curve change relabelled the same
    # sensor signal (17 mV) from 0.7 kg to 2.55 kg, but baseline default 0.7 kg works correctly.
    value: {type: u16, scale: 0.1, unit: kilogram_force, min: 0.0, max: 22.5, default: 0.7}
    implementation: active_decikg_precision_centikg_control_bank_v7
    wire_v7: u16_centikg_at_level_record_19_quantized_to_decikg
    legacy_v1_to_v6: native_millivolt_delta_migrated_through_active_torque_calibration
    ui_group: start_boost

  - key: riding_minimum_pedal_load_kg
    wire_id: null
    since: 7
    access: persistent_rw
    per_level: true
    # RESTORED to baseline (was 1.1 in regression). Baseline default 0.3 kg works correctly.
    value: {type: u8, scale: 0.1, unit: kilogram_force, min: 0.0, max: 22.5, default: 0.3}
    implementation: active_decikg_bank_v7_centikg_control
    wire_v7: u8_decikg_at_level_record_35
    legacy_v6: derived_from_minimum_threshold_minus_start_load_reduction_mv
    ui_group: start_boost

  - key: torque_lower_threshold_kg
    wire_id: null
    since: 1
    access: persistent_rw
    per_level: true
    value: {type: u16, scale: 0.01, unit: kilogram_force, min: 0.00, max: 31.20, default: null}
    implementation: planned_kg_boundary_for_existing_legacy_threshold
    native_limit: 0_to_2000_millivolt_legacy_full_current_point_at_40_millivolt_per_kg
    ui_decimals: 1
    legacy_binding: Para0_TQO_threshold_level_slots
    ui_group: torque_sensor

  - key: startup_boost_enabled
    wire_id: null
    since: 1
    access: persistent_rw
    per_level: true
    value: {type: bool, scale: 1, unit: none, min: false, max: true, default: true}
    implementation: active_compile_time_default_protocol_planned
    ui_group: start_boost

  - key: startup_boost_mode
    wire_id: null
    since: 1
    access: persistent_rw
    per_level: true
    value: {type: enum8, enum: startup_boost_mode, scale: 1, unit: none, min: 0, max: 2, default: cadence}
    implementation: active_compile_time_default_protocol_planned
    ui_group: start_boost

  - key: startup_boost_strength_pct
    wire_id: null
    since: 1
    access: persistent_rw
    per_level: true
    value: {type: u16, scale: 1, unit: percent_extra_torque, min: 0, max: 300, default: 200}
    implementation: active_compile_time_default_protocol_planned
    ui_group: start_boost

  - key: startup_boost_end_rpm
    wire_id: null
    since: 1
    access: persistent_rw
    per_level: true
    value: {type: u8, scale: 1, unit: rpm, min: 0, max: 120, default: 45}
    implementation: active_compile_time_default_protocol_planned
    ui_group: start_boost

  - key: startup_boost_auto_threshold_kg
    wire_id: null
    since: 1
    access: persistent_rw
    per_level: true
    value: {type: u16, scale: 0.01, unit: kilogram_force, min: 0.00, max: 60.00, default: 0.50}
    implementation: active_native_constant_kg_boundary_planned
    legacy_native_default: 20_millivolt_above_zero_at_40_millivolt_per_kg
    ui_group: start_boost

  - key: smooth_start_enabled
    wire_id: null
    since: 1
    access: persistent_rw
    per_level: true
    value: {type: bool, scale: 1, unit: none, min: false, max: true, default: false}
    implementation: active_compile_time_default_protocol_planned
    ui_group: start_boost

  - key: smooth_start_ms
    wire_id: null
    since: 1
    access: persistent_rw
    per_level: true
    value: {type: u16, scale: 1, unit: millisecond, min: 0, max: 5000, default: 300}
    implementation: active_compile_time_default_protocol_planned
    ui_group: start_boost

  - key: iq_rise_ms
    wire_id: null
    since: 1
    access: persistent_rw
    per_level: true
    value: {type: u16, scale: 1, unit: millisecond, min: 20, max: 5000, default: null}
    implementation: decision_required_per_level_or_global
    ui_group: dynamics_release

  - key: iq_fall_ms
    wire_id: null
    since: 1
    access: persistent_rw
    per_level: true
    value: {type: u16, scale: 1, unit: millisecond, min: 20, max: 5000, default: null}
    implementation: decision_required_per_level_or_global
    ui_group: dynamics_release

  - key: release_ms
    wire_id: null
    since: 1
    access: persistent_rw
    per_level: true
    value: {type: u16, scale: 1, unit: millisecond, min: 0, max: 3000, default: 0}
    implementation: active_compile_time_default_protocol_planned
    zero_semantics: use_adaptive_ramp
    ui_group: dynamics_release

  - key: power_rise_filter_ms
    wire_id: null
    since: 1
    access: persistent_rw
    per_level: true
    value: {type: u16, scale: 1, unit: millisecond, min: 0, max: 3000, default: 0}
    implementation: active_compile_time_default_protocol_planned
    zero_semantics: bypass
    ui_group: dynamics_release

  - key: power_fall_filter_ms
    wire_id: null
    since: 1
    access: persistent_rw
    per_level: true
    value: {type: u16, scale: 1, unit: millisecond, min: 0, max: 3000, default: 0}
    implementation: active_compile_time_default_protocol_planned
    zero_semantics: bypass
    ui_group: dynamics_release

  # FW-084 Extended Boost. Safety relevant as a group: together they can hold drive current
  # with the cranks stationary. duration_ms = 0 is the switch, and it is the default.
  - key: extended_boost_trigger_load_kg
    wire_id: null
    since: 8
    access: persistent_rw
    per_level: true
    # 0.5 kg per wire unit, unlike every other kilogram_force field: one byte had to cover
    # the full 60 kg sensor scale and the bank record is at the 255 B transport ceiling. 0.5
    # rather than 0.25 so every storable value is exact at one decimal place.
    value: {type: u8, scale: 0.5, unit: kilogram_force, min: 1.0, max: 60.0, default: 20.0}
    implementation: bank_v8_record_36
    safety_relevant: true
    ui_group: extended_boost

  - key: extended_boost_strength_pct
    wire_id: null
    since: 8
    access: persistent_rw
    per_level: true
    value: {type: u8, scale: 1, unit: percent_multiplier, min: 0, max: 255, default: 100}
    implementation: bank_v8_record_37
    safety_relevant: true
    ui_group: extended_boost

  - key: extended_boost_duration_ms
    wire_id: null
    since: 8
    access: persistent_rw
    per_level: true
    value: {type: u16, scale: 1, unit: millisecond, min: 0, max: 1000, default: 0}
    implementation: bank_v8_record_46
    zero_semantics: disabled
    safety_relevant: true
    ui_group: extended_boost

  - key: taper_start_kph
    wire_id: null
    since: 1
    access: persistent_rw
    per_level: true
    value: {type: u16, scale: 0.01, unit: kilometre_per_hour, min: 0, max: 60, default: null}
    implementation: planned_power
    ui_group: speed

  - key: taper_end_kph
    wire_id: null
    since: 1
    access: persistent_rw
    per_level: true
    value: {type: u16, scale: 0.01, unit: kilometre_per_hour, min: 0, max: 60, default: null}
    implementation: planned_power
    ui_group: speed

  - key: taper_shape
    wire_id: null
    since: 1
    access: persistent_rw
    per_level: true
    value: {type: enum8, enum: taper_shape, scale: 1, unit: none, min: 0, max: 2, default: null}
    implementation: planned_power
    ui_group: speed

# FW-129: whole-bike ride-feel settings that are NOT per level and NOT sensor calibration.
# They live in the global tuning blob (0x6023 read / 0x6024 write / 0x6022 save), v8, which
# stays exactly 32 B - both fields fit in u16 slots v6 had already reserved at offsets 24 and
# 26. Older blobs (v2..v7) migrate to the defaults below, which are the values the firmware
# behaved as before this card, so migrating changes nothing a rider can feel.
global_ride_feel_fields:
  - key: assist_torque_full_scale_kg
    wire_id: 0x6023_offset_24
    since: 8
    access: persistent_rw
    per_level: false
    value: {type: u16, scale: 0.01, unit: kilogram_force, min: 20.00, max: 120.00, default: 60.00}
    implementation: active_tuning_blob_v8
    applies_to_modes: [emtb, torque]
    # NOT the torque calibration span, NOT the sensor native maximum, NOT the ADC maximum.
    # Changing it does not move the measured kilogram reading, the zero, the calibration or
    # the 0x6025 telemetry; it only decides which pedal load reaches 100 % of the normalized
    # 0..160 axis eMTB and Torque are defined on.
    do_not_confuse_with: [torque_full_scale_kg, torque_full_scale_native]
    ui_group: ride_feel_torque

  - key: crank_length_mm
    wire_id: 0x6023_offset_26
    since: 8
    access: persistent_rw
    per_level: false
    value: {type: u16, scale: 1, unit: millimetre, min: 150, max: 190, default: 165}
    implementation: active_tuning_blob_v8
    # Part of the rider-power equation: power = pedal force x crank length x crank speed.
    # Applies to every mode that derives a request from rider power.
    applies_to_modes: [power_linear, power_progressive, power_curve]
    ui_group: bike_power_model

torque_fields:
  - key: torque_full_scale_kg
    wire_id: null
    since: 1
    access: read_only
    per_level: false
    value: {type: u16, scale: 0.01, unit: kilogram_force, min: 60.00, max: 60.00, default: 60.00}
    implementation: fixed_public_scale
    ui_group: torque_sensor

  - key: torque_zero_native
    wire_id: null
    since: 1
    access: read_only
    per_level: false
    value: {type: u16, scale: 1, unit: native_torque_sensor, min: 0, max: 65535, default: null}
    implementation: existing_automatic_zero_diagnostic_only
    user_visible: false
    ui_group: hidden_service

  - key: torque_calibration_reference_kg
    wire_id: null
    since: 1
    access: calibration_operation
    per_level: false
    value: {type: u16, scale: 0.01, unit: kilogram_force, min: 5.00, max: 30.00, default: null}
    # FW-129 D8: the capture derives the sensor GAIN relative to the factory characteristic
    # (span = TORQUE_DEFAULT_SPAN_NATIVE * measured_delta / default_delta_at_reference), it does
    # NOT extrapolate a straight line to 60 kg. The old form replaced the measured piecewise
    # curve with a line through the calibration point, which moved the reading by up to +21 %
    # at light load on a sensor that already matched the factory curve exactly.
    implementation: active_gain_correction_over_factory_piecewise
    ui_group: torque_sensor_calibration

  - key: torque_full_scale_native
    wire_id: null
    since: 1
    access: internal_persistent
    per_level: false
    value: {type: u16, scale: 1, unit: native_torque_sensor, min: 1000, max: 3300, default: 3150}
    implementation: implemented_MP_torque_full_scale_native_zero_means_not_calibrated
    current_binding: MP.torque_full_scale_native
    sensor_characteristic: linear_40_millivolt_per_kg_base_750
    note_do_not_confuse_with: TQ_FULL_SCALE_MV_is_assist_mapping_not_reading_scale
    user_visible: false
    ui_group: hidden_service

  - key: torque_gate_start_kg
    wire_id: null
    since: 1
    access: legacy_rw
    per_level: false
    value: {type: u16, scale: 0.01, unit: kilogram_force, min: 0.00, max: 60.00, default: 0.45}
    current_binding: TQ_GATE_MIN
    legacy_native_default: 18_millivolt_above_zero_at_40_millivolt_per_kg
    ui_group: torque_sensor

  - key: torque_gate_release_kg
    wire_id: null
    since: 1
    access: legacy_rw
    per_level: false
    value: {type: u16, scale: 0.01, unit: kilogram_force, min: 0.00, max: 60.00, default: 0.13}
    current_binding: TQ_GATE_RELEASE
    legacy_native_default: 5_millivolt_above_zero_at_40_millivolt_per_kg
    ui_group: torque_sensor

legacy_global_fields:
  - key: iq_rise_slow_ms
    wire_id: null
    since: 1
    access: legacy_rw
    per_level: false
    value: {type: u16, scale: 1, unit: millisecond, min: 20, max: 5000, default: 600}
    current_binding: IQ_RAMP_UP_SLOW_TICKS
    ui_group: advanced_legacy_dynamics

  - key: iq_rise_fast_ms
    wire_id: null
    since: 1
    access: legacy_rw
    per_level: false
    value: {type: u16, scale: 1, unit: millisecond, min: 20, max: 5000, default: 300}
    current_binding: IQ_RAMP_UP_FAST_TICKS
    ui_group: advanced_legacy_dynamics

  - key: iq_fall_slow_ms
    wire_id: null
    since: 1
    access: legacy_rw
    per_level: false
    value: {type: u16, scale: 1, unit: millisecond, min: 20, max: 5000, default: 1000}
    current_binding: IQ_RAMP_DOWN_SLOW_TICKS
    ui_group: advanced_legacy_dynamics

  - key: iq_fall_fast_ms
    wire_id: null
    since: 1
