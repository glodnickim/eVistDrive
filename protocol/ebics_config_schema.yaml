schema:
  name: ebics_ride_config
  version: 0
  status: draft
  target_version: 1
  complete_for_codegen: false
  reason_incomplete: >-
    Numeric wire IDs and deliberately uncalibrated profile defaults must be
    approved before generating firmware or Canable sources.

wire_protocol:
  transport: versioned_multiframe_block
  legacy_compatibility: Para0_Para1_Para2_read_write
  id_state: unassigned
  numeric_values: user_facing_engineering_units
  torque_user_unit: kilogram_force
  torque_native_values: hidden_service_and_firmware_only
  wire_encoding: round_engineering_value_divided_by_scale
  id_policy: >-
    Do not reuse apparently free Para0/Para1/Para2 bytes. Audit the existing
    HMI command space first, then allocate a separate versioned range.

command_plan:
  base_wire_command: null
  allocation_status: waiting_for_canable_and_full_hmi_log_audit
  commands:
    capabilities_schema: {offset: 0, wire_id: null}
    read_saved: {offset: 1, wire_id: null}
    read_runtime: {offset: 2, wire_id: null}
    apply_ram: {offset: 3, wire_id: null}
    save_flash: {offset: 4, wire_id: null}
    revert_ram: {offset: 5, wire_id: null}
  excluded_commands:
    - "0x0203"
    - "0x0204"
    - "0x1200"
    - "0x3000"
    - "0x3005"
    - "0x3100"
    - "0x3200-0x3205"
    - "0x320F"
    - "0x6000-0x6012"
    - "0x6101"
    - "0x6200"
    - "0x62D9"
    - "0x6300-0x6304"
    - "0x6400-0x6401"
    - "0xF203"

levels:
  - {index: 1, key: eco, label: ECO}
  - {index: 2, key: tour, label: TOUR}
  - {index: 3, key: sport, label: SPORT}
  - {index: 4, key: sport_plus, label: SPORT+}
  - {index: 5, key: boost, label: BOOST}

access_profiles:
  persistent_rw:
    persistent: true
    operations: [read, apply_ram, save_flash, revert]
  legacy_rw:
    persistent: true
    operations: [read, apply_ram, save_flash, revert]
    compatibility_only: true
  read_only:
    persistent: false
    operations: [read]
  calibration_operation:
    persistent: false
    operations: [calibrate]
  internal_persistent:
    persistent: true
    operations: [read, apply_ram, save_flash, revert]
    user_visible: false

enums:
  mode_type:
    legacy: 0
    power_linear: 1
    power_progressive: 2
    emtb_tsdz: 3
    emtb_custom: 4
  startup_boost_mode:
    cadence: 0
    speed: 1
    auto: 2
  taper_shape:
    linear: 0
    smoothstep: 1
    map: 2

rules:
  - id: speed_taper_order
    expression: taper_start_kph <= taper_end_kph
  - id: support_bounds_order
    expression: support_min_pct <= support_max_pct
  - id: ramp_speed_order
    expression: ramp_speed_low_kph <= ramp_speed_high_kph
  - id: ramp_cadence_order
    expression: ramp_cadence_low_rpm <= ramp_cadence_high_rpm
  - id: inactive_tsdz_modes
    expression: mode_type == legacy
    applies_until: hardware_legacy_regression_accepted
  - id: no_rotation_safe_default
    expression: assist_without_rotation == false
  - id: torque_public_scale
    expression: torque_full_scale_kg == 60.00
  - id: torque_zero_automatic_only
    expression: torque_zero_native is not writable
  - id: torque_calibration_order
    expression: torque_full_scale_native > torque_zero_native

# wire_id: null is intentional in draft version 0. It is not a free byte.
profile_fields:
  - key: mode_type
    wire_id: null
    since: 1
    access: persistent_rw
    per_level: true
    value: {type: enum8, enum: mode_type, scale: 1, unit: none, min: 0, max: 4, default: legacy}
    implementation: power_linear_progressive_available_default_legacy
    ui_group: characteristic

  - key: support_ratio_pct
    wire_id: null
    since: 1
    access: persistent_rw
    per_level: true
    value: {type: u16, scale: 1, unit: percent, min: 0, max: 1000, default: null}
    implementation: active_compile_time_defaults_protocol_planned
    ui_group: characteristic

  - key: support_min_pct
    wire_id: null
    since: 1
    access: persistent_rw
    per_level: true
    value: {type: u16, scale: 1, unit: percent, min: 0, max: 1000, default: null}
    implementation: active_compile_time_default_protocol_planned
    ui_group: characteristic

  - key: support_max_pct
    wire_id: null
    since: 1
    access: persistent_rw
    per_level: true
    value: {type: u16, scale: 1, unit: percent, min: 0, max: 1000, default: null}
    implementation: active_compile_time_default_protocol_planned
    ui_group: characteristic

  - key: reference_power_w
    wire_id: null
    since: 1
    access: persistent_rw
    per_level: true
    value: {type: u16, scale: 1, unit: watt, min: 50, max: 500, default: 200}
    implementation: active_compile_time_default_protocol_planned
    ui_group: characteristic

  - key: progression_pct
    wire_id: null
    since: 1
    access: persistent_rw
    per_level: true
    value: {type: u8, scale: 1, unit: percent, min: 0, max: 100, default: 0}
    implementation: active_compile_time_default_protocol_planned
    ui_group: characteristic

  - key: max_motor_power_w
    wire_id: null
    since: 1
    access: persistent_rw
    per_level: true
    value: {type: u16, scale: 1, unit: watt, min: 0, max: 1500, default: null}
    implementation: active_hard_limit_and_profile_field_protocol_planned
    ui_group: limits

  - key: max_iq_pct
    wire_id: null
    since: 1
    access: persistent_rw
    per_level: true
    value: {type: u8, scale: 1, unit: percent_phase_limit, min: 0, max: 100, default: null}
    implementation: active_compile_time_default_protocol_planned
    legacy_binding: Para1_level_current_slots
    ui_group: limits

  - key: emtb_parameter
    wire_id: null
    since: 1
    access: persistent_rw
    per_level: true
    value: {type: u8, scale: 1, unit: none, min: 0, max: 250, default: null}
    implementation: active_firmware_defaults_60_100_140_160_180
    reference: emmebrusa_apply_emtb_assist_denominator_510_minus_2x
    ui_group: characteristics

  - key: emtb_based_on_power
    wire_id: null
    since: 1
    access: persistent_rw
    per_level: true
    value: {type: bool, scale: 1, unit: none, min: false, max: true, default: true}
    implementation: active_cadence_reduces_denominator_when_true
    ui_group: characteristics

  - key: emtb_reference_voltage_mv
    wire_id: null
    since: 1
    access: persistent_rw
    per_level: true
    value: {type: u16, scale: 1, unit: millivolt, min: 24000, max: 60000, default: 36000}
    implementation: active_power_normalization_reference
    ui_group: characteristics

  - key: assist_without_rotation
    wire_id: null
    since: 1
    access: persistent_rw
    per_level: true
    value: {type: bool, scale: 1, unit: none, min: false, max: true, default: false}
    implementation: active_compile_time_default_protocol_planned
    safety_relevant: true
    ui_group: start_boost

  - key: without_rotation_threshold_kg
    wire_id: null
    since: 1
    access: persistent_rw
    per_level: true
    value: {type: u16, scale: 0.01, unit: kilogram_force, min: 0.00, max: 7.50, default: 0.45}
    implementation: active_native_threshold_kg_boundary_planned
    native_limit: 0_to_300_millivolt_above_auto_zero_at_40_millivolt_per_kg
    legacy_native_default: 18_millivolt_above_zero_at_40_millivolt_per_kg
    ui_group: start_boost

  - key: torque_lower_threshold_kg
    wire_id: null
    since: 1
    access: persistent_rw
    per_level: true
    value: {type: u16, scale: 0.01, unit: kilogram_force, min: 0.00, max: 31.20, default: null}
    implementation: planned_kg_boundary_for_existing_legacy_threshold
    native_limit: 0_to_2000_millivolt_legacy_full_current_point_at_40_millivolt_per_kg
    ui_decimals: 1
    legacy_binding: Para0_TQO_threshold_level_slots
    ui_group: torque_sensor

  - key: startup_boost_enabled
    wire_id: null
    since: 1
    access: persistent_rw
    per_level: true
    value: {type: bool, scale: 1, unit: none, min: false, max: true, default: true}
    implementation: active_compile_time_default_protocol_planned
    ui_group: start_boost

  - key: startup_boost_mode
    wire_id: null
    since: 1
    access: persistent_rw
    per_level: true
    value: {type: enum8, enum: startup_boost_mode, scale: 1, unit: none, min: 0, max: 2, default: cadence}
    implementation: active_compile_time_default_protocol_planned
    ui_group: start_boost

  - key: startup_boost_strength_pct
    wire_id: null
    since: 1
    access: persistent_rw
    per_level: true
    value: {type: u16, scale: 1, unit: percent_extra_torque, min: 0, max: 300, default: 200}
    implementation: active_compile_time_default_protocol_planned
    ui_group: start_boost

  - key: startup_boost_end_rpm
    wire_id: null
    since: 1
    access: persistent_rw
    per_level: true
    value: {type: u8, scale: 1, unit: rpm, min: 0, max: 120, default: 45}
    implementation: active_compile_time_default_protocol_planned
    ui_group: start_boost

  - key: startup_boost_auto_threshold_kg
    wire_id: null
    since: 1
    access: persistent_rw
    per_level: true
    value: {type: u16, scale: 0.01, unit: kilogram_force, min: 0.00, max: 60.00, default: 0.50}
    implementation: active_native_constant_kg_boundary_planned
    legacy_native_default: 20_millivolt_above_zero_at_40_millivolt_per_kg
    ui_group: start_boost

  - key: smooth_start_enabled
    wire_id: null
    since: 1
    access: persistent_rw
    per_level: true
    value: {type: bool, scale: 1, unit: none, min: false, max: true, default: false}
